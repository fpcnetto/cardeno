  async function montarBackup(){
    const execucoes = await listarExecucoes();
    /* Leva sempre o programa EM USO, para o backup bastar sozinho. */
    return { app: "caderno-de-ferro", formato: 1, exportadoEm: new Date().toISOString(), origem: modo,
             programaOrigem: CARREGADO.origem, programa: PROGRAMA, execucoes: execucoes };
  }

  /* ================= BACKUP EM MARKDOWN =================
     Um .md por sessão encerrada. Cada arquivo é COMPLETO: traz a leitura
     humana (sessão, últimas cargas, histórico) e, no fim, o bloco de dados
     com tudo o que o app precisa para restaurar, com assinatura de
     integridade. O arquivo mais recente basta; os antigos são redundância. */

  function fnv1a(str){
    let x = 0x811c9dc5;
    for(let i = 0; i < str.length; i++){ x ^= str.charCodeAt(i); x = Math.imul(x, 0x01000193) >>> 0; }
    return ("0000000" + x.toString(16)).slice(-8);
  }
  function dois(n){ return (n < 10 ? "0" : "") + n; }
  function isoParaBR(iso){ return iso && iso.length >= 10 ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4) : (iso || ""); }
  function celula(v){ return String(v == null ? "" : v).replace(/\|/g, "\\|").replace(/[\r\n]+/g, " ").trim(); }
  function tabela(cab, linhas){
    if(!linhas.length) return "_Sem registros._\n";
    return "| " + cab.join(" | ") + " |\n|" + cab.map(function(){ return "---"; }).join("|") + "|\n"
      + linhas.map(function(l){ return "| " + l.map(celula).join(" | ") + " |"; }).join("\n") + "\n";
  }
  /* Resume as séries de trabalho de um exercício numa sessão. */
  /* A unidade que vale é a do programa em uso: o número registrado se lê por ela. */
  function unidadeAtual(nome, gravada){
    for(const sx of S){ for(const e of sx.ex){ if(e.n === nome || (Array.isArray(e.nomesAntigos) && e.nomesAntigos.indexOf(nome) >= 0)) return e.un; } }
    return gravada || "";
  }
  function resumoExercicio(ls){
    const trab = ls.filter(function(l){ return l.tipo === "trabalho"; });
    const nao = ls.some(function(l){ return l.tipo === "não executado"; });
    if(!trab.length) return nao ? { carga:"", reps:"não executado", rir:"", obs: ls.map(function(l){ return l.obs; }).filter(Boolean).join("; ") } : null;
    const cargas = trab.map(function(l){ return l.carga === "" || l.carga == null ? "" : String(l.carga); });
    const unicas = cargas.filter(function(v, i){ return v !== "" && cargas.indexOf(v) === i; });
    const un = unidadeAtual(trab[0].exercicio, trab[0].un);
    const seg = /segundo/.test(un);
    return {
      carga: unicas.length ? unicas.join(" / ") + (un ? " " + un : "") : (seg ? "" : "peso do corpo"),
      reps: trab.map(function(l){ return (l.reps || "?") + (seg ? " s" : ""); }).join(" / "),
      rir: trab.map(function(l){ return l.rir === "" || l.rir == null ? "?" : l.rir; }).join(" / "),
      obs: ls.map(function(l){ return l.obs; }).filter(Boolean).join("; ")
    };
  }
  function porExercicio(linhas){
    const ordem = [], grupos = {};
    (linhas || []).forEach(function(l){
      const k = l.exercicio || "?";
      if(!grupos[k]){ grupos[k] = []; ordem.push(k); }
      grupos[k].push(l);
    });
    return ordem.map(function(k){ return { nome:k, linhas:grupos[k] }; });
  }

  async function montarBackupMd(idSessao){
    const bk = await montarBackup();
    const json = JSON.stringify(bk).replace(/`/g, "\\u0060");
    const assinatura = fnv1a(json);
    const ex = (bk.execucoes || []).slice().sort(function(a, b){
      const ka = (a.data || "") + (a.gravadoEm || ""), kb = (b.data || "") + (b.gravadoEm || "");
      return ka < kb ? 1 : (ka > kb ? -1 : 0);
    });
    const agora = new Date();
    const quando = dois(agora.getDate())+"/"+dois(agora.getMonth()+1)+"/"+agora.getFullYear()+", "+dois(agora.getHours())+"h"+dois(agora.getMinutes());
    const sessao = idSessao ? ex.find(function(e){ return e.id === idSessao; }) : null;
    const nome = "caderno-de-ferro-" + agora.getFullYear()+"-"+dois(agora.getMonth()+1)+"-"+dois(agora.getDate())
      + "-" + dois(agora.getHours()) + "h" + dois(agora.getMinutes()) + (sessao && sessao.sessao ? "-" + sessao.sessao : "") + ".md";

    const L = [];
    L.push("# Caderno de Ferro · backup de " + quando, "");
    L.push("> Backup completo. Este arquivo sozinho restaura tudo: no Caderno, abra Ajustes > Backup > Importar, escolha este arquivo e marque \"Importar também o programa\". Não edite o bloco \"Dados para restauração\": a assinatura no fim denuncia qualquer alteração.", "");
    L.push("- **Programa em uso:** " + (bk.programa && bk.programa.versao ? bk.programa.versao : "sem versão") + " (" + (bk.programaOrigem || "") + ")");
    L.push("- **Execuções registradas:** " + ex.length + (ex.length ? ", de " + isoParaBR(ex[ex.length-1].data) + " a " + isoParaBR(ex[0].data) : ""));
    if(sessao) L.push("- **Sessão que gerou este backup:** " + (sessao.sessao || "") + " · " + (sessao.nome || "") + ", " + isoParaBR(sessao.data));
    L.push("- **Assinatura:** fnv1a " + assinatura + " · " + json.length + " caracteres", "");

    if(sessao){
      L.push("## Sessão encerrada", "");
      L.push(tabela(["Exercício","Tipo","Série","Carga","Unidade","Reps","RIR","Observação"],
        (sessao.linhas || []).map(function(l){ return [l.exercicio, l.tipo, l.serie, l.carga, unidadeAtual(l.exercicio, l.un), l.reps, l.rir, l.obs]; })));
    }

    /* Última execução de cada exercício, na ordem do programa. */
    const ultimo = {};
    ex.slice().reverse().forEach(function(e){
      porExercicio(e.linhas).forEach(function(g){
        const r = resumoExercicio(g.linhas);
        if(r && r.reps !== "não executado") ultimo[g.nome] = { data:e.data, r:r };
      });
    });
    const ordemProg = [];
    S.forEach(function(sx){ sx.ex.forEach(function(e){ if(ordemProg.indexOf(e.n) < 0) ordemProg.push(e.n); }); });
    const nomes = Object.keys(ultimo).sort(function(a, b){
      const ia = ordemProg.indexOf(a), ib = ordemProg.indexOf(b);
      if(ia >= 0 && ib >= 0) return ia - ib; if(ia >= 0) return -1; if(ib >= 0) return 1; return a.localeCompare(b, "pt-BR");
    });
    L.push("## Última execução de cada exercício", "");
    L.push(tabela(["Exercício","Data","Carga","Reps","RIR"], nomes.map(function(n){
      const u = ultimo[n]; return [n, isoParaBR(u.data), u.r.carga, u.r.reps, u.r.rir];
    })));

    L.push("## Histórico, da mais recente para a mais antiga", "");
    ex.forEach(function(e){
      L.push("### " + isoParaBR(e.data) + " · " + (e.sessao || "") + " · " + (e.nome || ""), "");
      L.push(tabela(["Exercício","Carga","Reps","RIR","Observação"], porExercicio(e.linhas).map(function(g){
        const r = resumoExercicio(g.linhas); return r ? [g.nome, r.carga, r.reps, r.rir, r.obs] : null;
      }).filter(Boolean)));
    });

    L.push("## Dados para restauração", "");
    L.push("<!-- cdf-backup inicio fnv1a=" + assinatura + " execucoes=" + ex.length + " caracteres=" + json.length + " -->");
    L.push("```json", json, "```");
    L.push("<!-- cdf-backup fim -->", "");
    return { nome: nome, texto: L.join("\n"), execucoes: ex.length, assinatura: assinatura };
  }

  /* Lê um backup em JSON puro ou em .md e confere a assinatura. */
  function extrairBackup(texto){
    const t = String(texto || "").replace(/^\uFEFF/, "").trim();
    if(!t) return { erro: "Nada para importar." };
    if(t[0] === "{" || t[0] === "["){
      try{ return { bk: JSON.parse(t) }; }catch(e){ return { erro: "Não é um backup válido: " + e.message }; }
    }
    const i = t.indexOf("<!-- cdf-backup inicio");
    if(i < 0) return { erro: "Não encontrei o bloco \"Dados para restauração\" neste arquivo." };
    const fimCab = t.indexOf("-->", i);
    const cab = t.slice(i, fimCab);
    const mh = /fnv1a=([0-9a-f]{8})/.exec(cab), mn = /execucoes=(\d+)/.exec(cab), mc = /caracteres=(\d+)/.exec(cab);
    const a = t.indexOf("```json", fimCab);
    if(a < 0) return { erro: "O bloco de dados está incompleto." };
    const ini = t.indexOf("\n", a);
    const fim = t.indexOf("```", ini);
    if(ini < 0 || fim < 0) return { erro: "O bloco de dados está incompleto." };
    const json = t.slice(ini + 1, fim).replace(/\r/g, "").trim();
    if(mc && json.length !== Number(mc[1])) return { erro: "O bloco de dados está truncado ou foi alterado (o tamanho não confere). Use o backup anterior." };
    if(mh && fnv1a(json) !== mh[1]) return { erro: "O bloco de dados foi alterado (a assinatura não confere). Use o backup anterior." };
    let bk;
    try{ bk = JSON.parse(json); }catch(e){ return { erro: "O bloco de dados não abre: " + e.message }; }
    if(mn && (!bk || !Array.isArray(bk.execucoes) || bk.execucoes.length !== Number(mn[1])))
      return { erro: "O número de execuções não confere com a assinatura. Use o backup anterior." };
    return { bk: bk };
  }

  /* Pasta automática (Chrome no computador): o app grava o .md direto numa
     pasta escolhida uma vez, por exemplo dentro do OneDrive. No Android o
     Chrome não oferece isso, e o arquivo vai para Downloads. */
  const PASTA_OK = typeof window.showDirectoryPicker === "function" && !!window.isSecureContext && window.self === window.top && typeof indexedDB !== "undefined";
  function kv(modoTx, fn){
    return new Promise(function(ok, falha){
      const r = indexedDB.open("caderno-de-ferro", 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); };
      r.onerror = function(){ falha(r.error); };
      r.onsuccess = function(){
        const tx = r.result.transaction("kv", modoTx); const st = tx.objectStore("kv");
        const q = fn(st); tx.oncomplete = function(){ ok(q && q.result); }; tx.onerror = function(){ falha(tx.error); };
      };
    });
  }
  async function pastaBackup(){ if(!PASTA_OK) return null; try{ return (await kv("readonly", function(s){ return s.get("pasta"); })) || null; }catch(e){ return null; } }
  async function gravarNaPasta(pasta, nome, texto, pedir){
    let p = await pasta.queryPermission({ mode: "readwrite" });
    if(p !== "granted" && pedir) p = await pasta.requestPermission({ mode: "readwrite" });
    if(p !== "granted") return false;
    const fh = await pasta.getFileHandle(nome, { create: true });
    const w = await fh.createWritable(); await w.write(texto); await w.close();
    return true;
  }
  function registrarUltimoBackup(nome, destino){
    const d = new Date();
    lsSet("cdf:ultimoBackup", { nome: nome, destino: destino, quando: d.getFullYear()+"-"+dois(d.getMonth()+1)+"-"+dois(d.getDate())+" "+dois(d.getHours())+"h"+dois(d.getMinutes()) });
  }

  /* Chamado ao encerrar a sessão (e por Ajustes > Backup). Escreve o estado
     num elemento e devolve como o arquivo saiu. */
  async function exportarMd(idSessao, st, caixa){
    let md;
    try{ md = await montarBackupMd(idSessao); }catch(e){ st.textContent = "Não consegui montar o backup (" + e.message + "). Use Ajustes > Backup."; return "erro"; }
    const pasta = await pastaBackup();
    if(pasta){
      try{
        if(await gravarNaPasta(pasta, md.nome, md.texto, false)){
          registrarUltimoBackup(md.nome, "pasta " + pasta.name);
          st.textContent = "Backup salvo na pasta " + pasta.name + ": " + md.nome + " (" + md.execucoes + " execuções).";
          return "pasta";
        }
        st.textContent = "O Chrome quer nova autorização para a pasta " + pasta.name + ".";
        if(caixa){
          const b = botao("Salvar o backup na pasta " + pasta.name, "", async function(){
            try{
              if(await gravarNaPasta(pasta, md.nome, md.texto, true)){
                registrarUltimoBackup(md.nome, "pasta " + pasta.name);
                st.textContent = "Backup salvo na pasta " + pasta.name + ": " + md.nome + "."; b.remove();
              } else st.textContent = "Sem autorização. Baixe o backup pelo botão abaixo.";
            }catch(e){ st.textContent = "Falhou (" + e.message + "). Baixe pelo botão abaixo."; }
          });
          caixa.appendChild(b);
        }
      }catch(e){ st.textContent = "A pasta " + pasta.name + " não respondeu (" + e.message + "). Vou baixar o arquivo."; }
    }
    const ok = baixar(md.nome, md.texto, "text/markdown;charset=utf-8");
    if(ok){ registrarUltimoBackup(md.nome, "download"); }
    st.textContent = (pasta ? st.textContent + " " : "") + (ok
      ? "Backup baixado: " + md.nome + " (" + md.execucoes + " execuções), na pasta Downloads."
      : "O download falhou. Use Ajustes > Backup.");
    if(caixa){
      const b2 = botao("Baixar o backup de novo", "ghost", function(){ baixar(md.nome, md.texto, "text/markdown;charset=utf-8"); });
      caixa.appendChild(b2);
    }
    return ok ? "download" : "erro";
  }

  function telaBackup(){
    const c = $("ajustes-inner"); c.textContent = "";
    c.appendChild(el("h2",null,"Backup"));
    c.appendChild(el("h3",null,"Exportar"));
    c.appendChild(el("p","note", modo === "claude"
      ? "No claude.ai o download é bloqueado: use Copiar e cole num arquivo ou direto no outro aparelho, em Importar."
      : "O app gera um backup em .md a cada sessão encerrada. Cada arquivo leva o programa em uso e todo o histórico, e sozinho restaura tudo."));
    const ub = lsGet("cdf:ultimoBackup");
    if(ub && ub.nome) c.appendChild(el("p","note","Último backup: " + ub.nome + " (" + (ub.destino || "") + ", " + isoParaBR(String(ub.quando || "").slice(0,10)) + String(ub.quando || "").slice(10) + ")."));
    const be = el("div","btns");
    if(podeBaixar()) be.appendChild(botao("Baixar backup agora", "", async function(){
      const md = await montarBackupMd(null);
      baixar(md.nome, md.texto, "text/markdown;charset=utf-8"); registrarUltimoBackup(md.nome, "download");
      msg(c, md.execucoes + " execuções no arquivo " + md.nome + ".", "ok");
    }));
    be.appendChild(botao("Copiar backup", podeBaixar() ? "ghost" : "", async function(){
      const btn = this; const md = await montarBackupMd(null);
      copiar(md.texto, btn);
      msg(c, md.execucoes + " execuções copiadas, em Markdown.", "ok");
    }));
    c.appendChild(be);

    if(PASTA_OK && podeBaixar()){
      c.appendChild(el("h3",null,"Pasta automática"));
      const np = el("p","note","Verificando…"); c.appendChild(np);
      const bp = el("div","btns"); c.appendChild(bp);
      pastaBackup().then(function(p){
        np.textContent = p
          ? "Cada sessão encerrada grava o .md direto na pasta " + p.name + ". Se ela estiver dentro do OneDrive, o arquivo fica no computador e na nuvem."
          : "Escolha uma vez uma pasta (por exemplo, OneDrive > Treinos > Backups) e cada sessão encerrada grava o .md nela, sem passar por Downloads.";
        bp.appendChild(botao(p ? "Trocar a pasta" : "Escolher a pasta", "", async function(){
          try{
            const d = await window.showDirectoryPicker({ id: "cdf-backup", mode: "readwrite", startIn: "documents" });
            await kv("readwrite", function(s){ return s.put(d, "pasta"); });
            const md = await montarBackupMd(null);
            await gravarNaPasta(d, md.nome, md.texto, true); registrarUltimoBackup(md.nome, "pasta " + d.name);
            msg(c, "Pasta " + d.name + " escolhida. Primeiro backup gravado nela: " + md.nome + ".", "ok");
          }catch(e){ if(e && e.name !== "AbortError") msg(c, "Não deu para usar a pasta: " + e.message, "err"); }
        }));
        if(p) bp.appendChild(botao("Esquecer a pasta", "ghost", async function(){
          try{ await kv("readwrite", function(s){ return s.delete("pasta"); }); msg(c, "Pasta esquecida. Os backups voltam a ir para Downloads.", "ok"); }catch(e){}
        }));
      });
    }

    c.appendChild(el("h3",null,"Importar"));
    c.appendChild(el("p","note","Escolha o arquivo de backup (.md ou .json) ou cole o texto. O app confere a assinatura antes de importar. Execuções com a mesma data e ficha são substituídas; as demais são somadas."));
    const fi = el("input"); fi.type = "file"; fi.accept = ".md,.json,.txt,text/markdown,application/json,text/plain"; fi.style.marginTop = "6px";
    c.appendChild(fi);
    const ta = el("textarea","paste"); ta.placeholder = "Ou cole aqui o backup copiado"; ta.style.marginTop = "8px";
    c.appendChild(ta);
    const lab = el("label","chk"); const cb = el("input"); cb.type = "checkbox";
    lab.appendChild(cb); lab.appendChild(document.createTextNode("Importar também o programa que vier no backup"));
    c.appendChild(lab);
    fi.addEventListener("change", function(){
      const f = fi.files && fi.files[0]; if(!f) return;
      const r = new FileReader(); r.onload = function(){ ta.value = String(r.result || ""); }; r.readAsText(f);
    });
    const bi = el("div","btns");
    bi.appendChild(botao("Importar", "", async function(){
      const lido = extrairBackup(ta.value);
      if(lido.erro){ msg(c, lido.erro, "err"); return; }
      const bk = lido.bk;
      const lista = Array.isArray(bk) ? bk : (bk && bk.execucoes);
      if(!Array.isArray(lista)){ msg(c, "Não encontrei a lista de execuções no backup.", "err"); return; }
      let n = 0;
      for(const ex of lista){
        if(!ex || typeof ex.data !== "string" || !Array.isArray(ex.linhas)) continue;
        const id = ex.id || (ex.data + "__" + (ex.sessao || "X"));
        const doc = Object.assign({}, ex); delete doc.id;
        try{ await salvarExecucao(id, doc); n++; }catch(e){}
      }
      let extra = "";
      if(cb.checked && bk && bk.programa){
        const erros = validarPrograma(bk.programa);
        if(erros.length) extra = " O programa do backup não passou na validação e ficou de fora.";
        else { try{ localStorage.setItem("cdf:programa", JSON.stringify(bk.programa)); extra = " Programa importado."; }catch(e){} }
      }
      msg(c, n + " execuções importadas." + extra + " Recarregando…", "ok");
      setTimeout(function(){ location.reload(); }, 900);
    }));
    bi.appendChild(voltarBtn());
    c.appendChild(bi);
  }

  async function telaCSV(){
    const c = $("ajustes-inner"); c.textContent = "";
    c.appendChild(el("h2",null,"Planilha (CSV)"));
    const docs = await listarExecucoes();
    const q = function(v){ v = v == null ? "" : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
    const linhas = ["Data;Ficha;Grupo;Exercício;Série;Tipo;Carga;Unidade;Reps;RIR;Observação"];
    docs.forEach(function(d){ (d.linhas || []).forEach(function(l){
      linhas.push([l.data, l.ficha, l.grupo, l.exercicio, l.serie, l.tipo, l.carga, l.un, l.reps, l.rir, l.obs].map(q).join(";"));
    }); });
    const csv = linhas.join("\n");
    c.appendChild(el("p","note", (linhas.length - 1) + " linhas, separadas por ponto e vírgula, no formato que o Excel em português abre direto."));
    const pre = el("pre","log"); pre.textContent = linhas.slice(0, 40).join("\n") + (linhas.length > 40 ? "\n…" : ""); c.appendChild(pre);
    const b = el("div","btns");
    if(podeBaixar()) b.appendChild(botao("Baixar CSV", "", function(){ baixar("caderno-de-ferro-" + carimbo() + ".csv", "\ufeff" + csv, "text/csv;charset=utf-8"); }));
    b.appendChild(botao("Copiar", podeBaixar() ? "ghost" : "", function(){ copiar(csv, this); }));
    b.appendChild(voltarBtn());
    c.appendChild(b);
  }

  /* ================= TEMA ================= */

  const temaSalvo = lsGet("cdf:tema");
  if(temaSalvo === "dark" || temaSalvo === "light"){
    document.documentElement.setAttribute("data-theme", temaSalvo);
    $("btn-tema").setAttribute("aria-pressed", String(temaSalvo==="dark"));
  }
  $("btn-tema").addEventListener("click", function(){
    const cur = document.documentElement.getAttribute("data-theme");
    const escuro = cur ? cur === "dark"
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    const novo = escuro ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", novo);
    lsSet("cdf:tema", novo);
    $("btn-tema").setAttribute("aria-pressed", String(novo==="dark"));
  });

  /* ================= BOOT ================= */

  (function(){
    const d = new Date();
    $("hoje").textContent = DIAS[d.getDay()]+", "+d.getDate()+" de "+MESES[d.getMonth()]+" de "+d.getFullYear();
  })();

  (function(){
    const L = $("links"); L.textContent = "";
    LINKS.slice(0,2).forEach(function(l, i){
      if(i) L.appendChild(document.createTextNode(" · "));
      const a = el("a", null, l.nome); a.href = l.url; a.target = "_blank"; a.rel = "noopener";
      a.style.color = "var(--accent)"; a.style.fontWeight = "600";
      L.appendChild(a);
    });
    if(LINKS.length > 2) L.appendChild(document.createTextNode(" · os outros trimestres em Regras"));
  })();

  $("btn-regras").addEventListener("click", function(){ montarRegras(); abrirSheet("sheet-regras"); });
  $("btn-ajustes").addEventListener("click", function(){ telaAjustes(); abrirSheet("sheet-ajustes"); });
  $("btn-encerrar").addEventListener("click", encerrar);

  const ultima = lsGet("cdf:ultima");
  const inicial = (ultima && S.some(function(s){ return s.id===ultima; }) && lsGet("cdf:"+hojeISO+":"+ultima))
    ? ultima : sessaoDoDia().id;
  escolher(inicial);
  pinta();

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("db").then(function(d){
      db = d;
      if(db){ modo = "claude"; }
      carregarHistorico();
    }, function(){ carregarHistorico(); });
  } else {
    carregarHistorico();
    /* Pede ao navegador que não apague os dados deste app por falta de espaço. */
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    /* Instalado como app (servido por https), o service worker guarda o
       arquivo para funcionar sem internet na academia. */
    try{
      const nativo = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform());
      if(!nativo && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
        navigator.serviceWorker.register("sw.js").catch(function(){});
      }
    }catch(e){}
  }

  if(navigator.wakeLock && navigator.wakeLock.request){
    let lock = null;
    const pedir = function(){
      navigator.wakeLock.request("screen").then(function(l){ lock = l; l.addEventListener && l.addEventListener("release", function(){ lock = null; }); }, function(){});
    };
    pedir();
    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState === "visible" && !lock) pedir();
    });
  }
})();
</script>
</body>
</html>
