<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mesa de Ferro</title>
<meta name="theme-color" content="#9A5B13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mesa de Ferro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#F2F4F6; --surface:#FFFFFF; --surface2:#E9EDF1; --line:#D3DAE1;
    --ink:#12161A; --ink2:#3B444E; --muted:#66727E;
    --accent:#17767E; --accent-ink:#FFFFFF; --accent-soft:#D6EDEE;
    --ok:#2F7D53; --ok-soft:#DCEFE3;
    --warn:#9A6B10; --warn-soft:#F6EBD4;
    --stop:#B5301F; --stop-soft:#F8DFDA;
    --shadow:0 1px 2px rgba(18,22,26,.08), 0 8px 24px rgba(18,22,26,.06);
    --r:14px;
    --font-d:"Oswald", "Arial Narrow", system-ui, sans-serif;
    --font-b:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --font-m:"IBM Plex Mono", ui-monospace, "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E1114; --surface:#171B20; --surface2:#20262D; --line:#2C333B;
      --ink:#ECF0F4; --ink2:#BCC5CE; --muted:#8A95A1;
      --accent:#48B0B8; --accent-ink:#06171A; --accent-soft:#12343A;
      --ok:#5CBE87; --ok-soft:#14301F;
      --warn:#DCA33C; --warn-soft:#32260F;
      --stop:#E86552; --stop-soft:#3A1912;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E1114; --surface:#171B20; --surface2:#20262D; --line:#2C333B;
    --ink:#ECF0F4; --ink2:#BCC5CE; --muted:#8A95A1;
    --accent:#48B0B8; --accent-ink:#06171A; --accent-soft:#12343A;
    --ok:#5CBE87; --ok-soft:#14301F;
    --warn:#DCA33C; --warn-soft:#32260F;
    --stop:#E86552; --stop-soft:#3A1912;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--font-b); font-size:16px; line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-top:env(safe-area-inset-top,0px);
  }
  [hidden]{display:none!important}
  .wrap{max-width:560px; margin:0 auto; padding-inline:16px; padding-block:0 132px}
  h1,h2,h3{margin:0; text-wrap:balance}
  button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

  /* ---------- topo ---------- */
  header.top{
    position:sticky; top:0; z-index:40;
    background:var(--ground); border-bottom:1px solid var(--line);
    padding:10px 16px 8px;
  }
  .top-inner{max-width:560px; margin:0 auto; display:flex; align-items:center; gap:12px}
  .brand{font-family:var(--font-d); font-weight:600; font-size:19px; letter-spacing:.02em; line-height:1.1}
  .brand small{display:block; font-family:var(--font-b); font-weight:400; font-size:11px;
    letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin-top:2px}
  .top-actions{margin-left:auto; display:flex; gap:8px}
  .icon-btn{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    min-width:44px; height:40px; padding:0 10px; font-size:12px; font-weight:600;
    letter-spacing:.06em; text-transform:uppercase; color:var(--ink2);
  }
  .icon-btn[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

  /* ---------- seletor de sessão ---------- */
  .picker{display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin:14px 0 4px}
  .picker button{
    background:var(--surface); border:1px solid var(--line); border-radius:11px;
    padding:9px 2px 8px; text-align:center; min-height:58px;
  }
  .picker button .k{font-family:var(--font-d); font-size:19px; font-weight:600; display:block; line-height:1}
  .picker button .d{font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-top:4px; display:block}
  .picker button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .picker button[aria-pressed="true"] .d{color:var(--accent-ink); opacity:.8}
  .picker button.feita{border-color:var(--ok)}
  .picker button.feita .d{color:var(--ok)}
  .picker button.feita[aria-pressed="true"] .d{color:var(--accent-ink)}
  .picker button.hoje .k::after{content:"·"; color:var(--accent); margin-left:3px}
  .picker button.hoje[aria-pressed="true"] .k::after{color:var(--accent-ink)}
  .picker button.comp{border-style:dashed}
  .picker-nota{margin:7px 0 0; font-size:12px; line-height:1.4; color:var(--muted)}

  /* ---------- cabeçalho da sessão ---------- */
  .sess-head{margin:14px 0 6px}
  .sess-head h1{font-family:var(--font-d); font-size:30px; font-weight:600; letter-spacing:.01em; line-height:1.05}
  .sess-head .grupos{color:var(--muted); font-size:13.5px; margin-top:4px}
  .meta-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
  .chip{
    max-width:100%; white-space:normal;
    font-family:var(--font-m); font-size:11.5px; font-weight:500; letter-spacing:.02em;
    background:var(--surface2); border:1px solid var(--line); color:var(--ink2);
    padding:4px 9px; border-radius:999px;
  }
  .chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
  .chip.warn{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}

  .bar{height:6px; background:var(--surface2); border-radius:999px; overflow:hidden; margin-top:12px; border:1px solid var(--line)}
  .bar i{display:block; height:100%; background:var(--accent); width:0%; transition:width .28s ease}

  /* ---------- aviso da semana ---------- */
  .banner{
    margin-top:14px; border-radius:var(--r); padding:12px 14px;
    background:var(--warn-soft); border:1px solid var(--warn); color:var(--ink);
  }
  .banner b{font-family:var(--font-d); font-weight:600; letter-spacing:.03em; text-transform:uppercase; font-size:12.5px; color:var(--warn); display:block; margin-bottom:3px}
  .banner p{margin:0; font-size:13.5px; line-height:1.45}

  /* ---------- exercício ---------- */
  .list{display:flex; flex-direction:column; gap:10px; margin-top:16px}
  .ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow)}
  .ex.done{box-shadow:none; background:var(--surface2)}
  .ex.skip{box-shadow:none; background:var(--surface2); opacity:.9}
  .ex-head{display:flex; align-items:flex-start; gap:11px; width:100%; background:none; border:0; padding:13px 14px; text-align:left}
  .num{
    flex:0 0 auto; width:28px; height:28px; border-radius:8px; margin-top:1px;
    display:grid; place-items:center; font-family:var(--font-m); font-size:12.5px; font-weight:600;
    background:var(--surface2); color:var(--muted); border:1px solid var(--line);
  }
  .ex.active .num{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .ex.done .num{background:var(--ok-soft); color:var(--ok); border-color:var(--ok)}
  .ex.skip .num{background:var(--stop-soft); color:var(--stop); border-color:var(--stop)}
  .ex-title{flex:1 1 auto; min-width:0}
  .ex-title .n{font-weight:600; font-size:15.5px; line-height:1.28; display:block}
  .ex-title .ap{display:block; font-size:12px; color:var(--muted); margin-top:2px}
  .ex-title .rec{display:block; font-family:var(--font-m); font-size:12.5px; color:var(--ok); margin-top:5px; font-weight:500}
  .ex.skip .ex-title .rec{color:var(--stop)}
  .tag{
    flex:0 0 auto; font-family:var(--font-m); font-size:11px; font-weight:600;
    padding:3px 7px; border-radius:7px; background:var(--surface2); color:var(--ink2); border:1px solid var(--line); margin-top:2px;
  }
  .tag.aq{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
  .tag.tec{background:var(--warn-soft); color:var(--warn); border-color:var(--warn)}

  .body{padding:0 14px 14px; border-top:1px solid var(--line); display:none}
  .ex.active .body{display:block}

  .kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:13px 0 0; font-size:13px}
  .kv dt{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding-top:3px}
  .kv dd{margin:0; font-family:var(--font-m); font-size:13px; color:var(--ink2)}

  .alvo{
    margin-top:13px; border-radius:11px; padding:11px 13px;
    background:var(--accent-soft); border:1px solid var(--accent);
  }
  .alvo .lab{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent); font-weight:600}
  .alvo .val{font-family:var(--font-d); font-size:23px; font-weight:600; margin-top:2px; line-height:1.15; color:var(--ink)}
  .alvo .why{font-size:12.5px; color:var(--ink2); margin-top:4px; line-height:1.4}

  .ativa{
    margin-top:13px; border-radius:11px; padding:10px 12px;
    background:var(--surface2); border:1px dashed var(--line);
  }
  .ativa .lab{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600}
  .ativa .why{font-size:12.5px; color:var(--ink2); margin-top:3px; line-height:1.4}
  .ativa .duo{display:flex; gap:8px; margin-top:8px}
  .ativa .duo > div{flex:1 1 0; min-width:0}
  .ativa .duo span{display:block; font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; font-weight:600}
  .ativa input{
    width:100%; height:44px; text-align:center; font-family:var(--font-m); font-size:17px; font-weight:600;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:9px;
    font-variant-numeric:tabular-nums; padding:0 4px;
  }
  .obs{margin-top:14px}
  .obs > label{display:block; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; font-weight:600}
  .obs textarea{
    width:100%; min-height:62px; resize:vertical; font-family:var(--font-b); font-size:14px; line-height:1.4;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:11px; padding:10px 11px;
  }
  .obs .dica{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.35}

  .nota{margin-top:11px; font-size:13px; color:var(--ink2); line-height:1.45; border-left:3px solid var(--line); padding-left:10px}
  .nota.risk{border-left-color:var(--stop); color:var(--ink)}

  /* steppers */
  .field{margin-top:14px}
  .field > label{display:block; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; font-weight:600}
  .stepper{display:flex; align-items:stretch; gap:8px}
  .stepper button{
    flex:0 0 56px; height:52px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface2); font-size:24px; font-family:var(--font-d); line-height:1; color:var(--ink);
  }
  .stepper button:active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .stepper input{
    flex:1 1 auto; min-width:0; height:52px; text-align:center;
    font-family:var(--font-m); font-size:21px; font-weight:600;
    background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:11px; padding:0 6px;
    font-variant-numeric:tabular-nums;
  }

  table.series{width:100%; border-collapse:collapse; margin-top:12px; font-family:var(--font-m); font-size:13px; table-layout:fixed}
  table.series th{font-family:var(--font-b); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; text-align:left; padding:0 0 6px}
  table.series td{padding:4px 4px 4px 0; border-top:1px solid var(--line)}
  table.series td:first-child, table.series th:first-child{width:30px; color:var(--muted)}
  table.series td:nth-child(2), table.series th:nth-child(2){width:84px}
  table.series input{
    width:100%; height:44px; text-align:center; font-family:var(--font-m); font-size:16px; font-weight:600;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:9px;
    font-variant-numeric:tabular-nums; padding:0 2px;
  }
  .rirs{display:flex; gap:4px; padding-left:8px}
  .rirs button{
    flex:1 1 0; min-width:0; height:44px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); font-family:var(--font-m); font-size:14px; font-weight:600; padding:0;
  }
  .rirs button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

  .row-btns{display:flex; gap:8px; margin-top:15px}
  .btn{
    flex:1 1 0; min-height:52px; border-radius:12px; border:1px solid var(--accent);
    background:var(--accent); color:var(--accent-ink);
    font-family:var(--font-d); font-size:16px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  }
  .btn.danger{background:var(--surface); color:var(--stop); border-color:var(--stop); flex:0 0 40%}

  /* ---------- rodapé fixo ---------- */
  .dock{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--surface); border-top:1px solid var(--line);
    padding:9px 16px calc(9px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px rgba(0,0,0,.10);
  }
  .dock-inner{max-width:560px; margin:0 auto; display:flex; align-items:center; gap:10px}
  .timer{flex:0 0 auto; display:flex; align-items:baseline; gap:6px; font-family:var(--font-m); font-variant-numeric:tabular-nums}
  .timer .t{font-family:var(--font-d); font-size:30px; font-weight:600; line-height:1; min-width:74px}
  .timer.run .t{color:var(--accent)}
  .timer .s{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .dock .acts{margin-left:auto; display:flex; gap:7px}
  .dock .acts button{
    min-height:46px; padding:0 13px; border-radius:11px; border:1px solid var(--line);
    background:var(--surface2); font-family:var(--font-d); font-size:14px; font-weight:500;
    letter-spacing:.03em; text-transform:uppercase; color:var(--ink);
  }
  .dock .acts button.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

  /* ---------- folhas ---------- */
  .sheet{position:fixed; inset:0; z-index:60; display:none}
  .sheet[open]{display:block}
  .sheet .scrim{position:absolute; inset:0; background:rgba(8,10,12,.6)}
  .sheet .panel{
    position:absolute; left:0; right:0; bottom:0; max-height:86vh; overflow:auto;
    background:var(--ground); border-top:1px solid var(--line);
    border-radius:20px 20px 0 0; padding:18px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet .panel > .inner{max-width:560px; margin:0 auto}
  .sheet h2{font-family:var(--font-d); font-size:22px; font-weight:600; margin-bottom:4px}
  .sheet h3{font-family:var(--font-d); font-size:15px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:20px 0 8px}
  .rule{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:14px; line-height:1.45}
  .rule:first-of-type{border-top:0}
  .rule .i{flex:0 0 auto; width:24px; height:24px; border-radius:7px; display:grid; place-items:center;
    font-family:var(--font-m); font-size:12px; font-weight:600; background:var(--surface2); border:1px solid var(--line); color:var(--muted)}
  .rule.hard .i{background:var(--stop-soft); border-color:var(--stop); color:var(--stop)}
  .rule a{color:var(--accent); font-weight:600}
  .close{width:100%; min-height:50px; margin-top:20px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface); font-family:var(--font-d); font-size:15px; letter-spacing:.04em; text-transform:uppercase}

  .menu-item{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 12px; margin-top:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; font-size:14.5px}
  .menu-item b{display:block; font-family:var(--font-d); font-size:16px; font-weight:600; letter-spacing:.02em}
  .menu-item span{display:block; font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.35}
  textarea.code{width:100%; min-height:46vh; font-family:var(--font-m); font-size:12px; line-height:1.45;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:11px; padding:10px; resize:vertical; white-space:pre}
  textarea.paste{width:100%; min-height:120px; font-family:var(--font-m); font-size:12px;
    background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:11px; padding:10px}
  .btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
  .btns .btn{flex:1 1 140px; min-height:46px; font-size:14px}
  .btn.ghost{background:var(--surface); color:var(--ink2); border-color:var(--line)}
  .msg{margin-top:10px; font-size:13px; line-height:1.45; padding:10px 12px; border-radius:10px; background:var(--surface2); border:1px solid var(--line)}
  .msg.err{background:var(--stop-soft); border-color:var(--stop); color:var(--ink)}
  .msg.ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ink)}
  .chk{display:flex; gap:8px; align-items:center; margin-top:10px; font-size:13.5px}
  pre.log{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px; overflow-x:auto; font-family:var(--font-m); font-size:11.5px; line-height:1.6;
    white-space:pre; margin-top:12px; color:var(--ink2);
  }
  .note{font-size:12.5px; color:var(--muted); line-height:1.5; margin-top:14px}
  .status{font-family:var(--font-m); font-size:11.5px; color:var(--muted); margin-top:10px; text-align:center}

  /* ---------- Mesa de Ferro ---------- */
  :root{ --accent:#9A5B13; --accent-ink:#FFFFFF; --accent-soft:#F4E6D3; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --accent:#E3A55A; --accent-ink:#1A1004; --accent-soft:#3A2810; } }
  :root[data-theme="dark"]{ --accent:#E3A55A; --accent-ink:#1A1004; --accent-soft:#3A2810; }
  .daynav{display:flex; align-items:center; gap:8px; margin:14px 0 2px}
  .daynav button{min-width:46px; min-height:44px; border-radius:11px; border:1px solid var(--line); background:var(--surface); font-size:20px}
  .daynav button:disabled{opacity:.35}
  .daynav .d{flex:1; text-align:center; font-family:var(--font-d); font-size:18px; font-weight:600; line-height:1.15}
  .daynav .d small{display:block; font-family:var(--font-b); font-size:11px; font-weight:400; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:14px; margin-top:12px}
  .card h2{font-family:var(--font-d); font-size:17px; font-weight:600; letter-spacing:.02em}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line); background:var(--surface2); color:var(--ink2)}
  .chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--ink)}
  .chip.ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ink)}
  .chip.warn{background:var(--warn-soft); border-color:var(--warn); color:var(--ink)}
  button.chip{cursor:pointer}
  .big{display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; margin-top:10px}
  .big .b{min-width:0}
  .big .n{font-family:var(--font-d); font-size:32px; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
  .big .u{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:3px}

  .meal-head .t{flex:1; font-family:var(--font-d); font-size:17px; font-weight:600; letter-spacing:.02em}
  .meal-head .k{font-family:var(--font-m); font-size:13px; font-variant-numeric:tabular-nums; text-align:right}
  .meal-head .k small{display:block; font-size:10.5px; color:var(--muted)}
  .meal-body{padding:0 14px 14px}
  .it{display:grid; grid-template-columns:minmax(0,1fr) 74px 58px auto; gap:6px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:14px}

<header class="top">

    if(!p.cardapios || typeof p.cardapios !== "object") e.push("falta cardapios");

      ["kcal","p","c","g"].forEach(function(k){ if(!a || !isFinite(Number(a[k]))) e.push("alimento " + id + " sem número em " + k); });

  function macros(a, q){

  /* O dia planejado: refeições já registradas ou editadas ficam como estão;

  function planoDoDia(d){
    const reg = dia(d) || { r:{} };
    const cardapio = PLANO.cardapios[PLANO.tipos[tipoDoDia(d)].cardapio] || [];
    const refs = cardapio.map(function(r){
      const salvo = reg.r && reg.r[r.id];
      const itens = salvo && salvo.i
        ? salvo.i.map(function(x){ return { a:x[0], q:x[1] }; })
        : r.itens.map(function(it){ return { a:it.a, q:it.q, alav:it.alav || null, base:it.q }; });
      return { id:r.id, hora:r.hora, nome:r.nome, itens:itens, ok: !!(salvo && salvo.ok), fixa: !!salvo, extra:false };
    });
    (reg.x || []).forEach(function(x){
      refs.push({ id:x.id, hora:x.hora || "", nome:x.nome || "Extra", itens:(x.i || []).map(function(y){ return { a:y[0], q:y[1] }; }), ok: !!x.ok, fixa:true, extra:true });
    });

    let resto = null;

      const total = function(){ return refs.reduce(function(s, r){ return s + somar(r.itens).kcal; }, 0); };
      let diff = meta - total();

      // Dentro da tolerância (padrão 25 kcal, 1% da meta) não mexe: o erro
      // dos rótulos é maior que isso. Fora dela, a cada passo escolhe a
      // alavanca cujo degrau deixa o dia mais perto da meta, sempre no
      // mesmo sentido (só sobe ou só desce), até não haver melhora.
      const alav = PLANO.alavancas || { subir:[], descer:[] };
      const tol = isFinite(alav.tolerancia) ? Number(alav.tolerancia) : 25;
      const sinal = diff > 0 ? 1 : -1;
      const ids = (sinal > 0 ? alav.subir : alav.descer) || [];
      for(let volta = 0; volta < 80 && Math.abs(diff) > tol; volta++){
        let melhor = null;
        ids.forEach(function(id, ordem){
          const its = []; livres.forEach(function(r){ r.itens.forEach(function(it){ if(it.a === id && it.alav) its.push(it); }); });
          if(!its.length) return;
          const pode = its.every(function(it){ return sinal > 0 ? it.q + it.alav.passo <= it.alav.max : it.q - it.alav.passo >= it.alav.min; });
          if(!pode) return;
          const passoK = its.reduce(function(s, it){ return s + macros(it.a, it.alav.passo).kcal; }, 0) * sinal;
          const depois = Math.abs(diff - passoK);
          if(depois >= Math.abs(diff)) return;
          if(!melhor || depois < melhor.depois - 0.01) melhor = { its:its, passoK:passoK, depois:depois, ordem:ordem };
        });

  /* ================= GASTO ADAPTATIVO =================
     A taxa basal pela fórmula serve de referência. O que define a meta é o
     gasto observado: o que entrou (dias com registro completo) menos o que a

  function pesagens(){

  function estimarGasto(ate){

    const N = cfg.janelaDias || 21, ini0 = somaDias(ate, -(N - 1));
    /* Carência: os primeiros dias do perfil e de cada fase ficam fora da conta. A mudança de dieta mexe na água e no
       glicogênio, e a balança mostra isso como ganho ou perda de tecido; sem a carência, a Mesa corrigiria o gasto

    const car = isFinite(cfg.carenciaDias) ? Number(cfg.carenciaDias) : 14;
    let ini = ini0;
    if(car > 0){

  /* Troca equivalente: mesma proteína, mesmo carboidrato, mesmo peso ou
     mesmas calorias, conforme o grupo do alimento. */
  function equivalentes(a, q){
    const al = ALI[a]; if(!al) return [];
    const crit = (PLANO.trocaPor || {})[al.grupo] || "kcal";
    const ref = macros(a, q);
    return Object.keys(ALI).filter(function(b){ return b !== a && ALI[b].grupo === al.grupo && (ALI[b].base || "g") === (al.base || "g"); }).map(function(b){
      const bl = ALI[b]; const por1 = macros(b, bl.base === "un" ? 1 : 100);
      let qb;
      if(crit === "peso") qb = q;
      else { const alvo = crit === "p" ? ref.p : crit === "c" ? ref.c : ref.kcal; const k = crit === "p" ? por1.p : crit === "c" ? por1.c : por1.kcal;
        qb = k > 0 ? alvo / k * (bl.base === "un" ? 1 : 100) : null; }
      if(qb == null || !isFinite(qb)) return null;
      qb = bl.base === "un" ? Math.round(qb) : Math.round(qb / 5) * 5;
      const m = macros(b, qb);
      return { a:b, q:qb, m:m, dk:m.kcal - ref.kcal, dg:m.g - ref.g };
    }).filter(Boolean).sort(function(x, y){ return x.m.kcal - y.m.kcal; });
  }
  function rotuloCrit(a){ const c = (PLANO.trocaPor || {})[(ALI[a] || {}).grupo] || "kcal"; return c === "p" ? "mesma proteína" : c === "c" ? "mesmo carboidrato" : c === "peso" ? "mesmo peso" : "mesmas calorias"; }

  function graficoPeso(){
    const ps = pesagens().slice(-42); const tr = tendencia();
    if(ps.length < 2) return el("p", "note", "O gráfico aparece a partir da segunda pesagem.");
    const W = 520, H = 180, pad = 30;
    const vals = ps.map(function(p){ return p.kg; }).concat(ps.map(function(p){ return tr[p.d]; }));
    let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals); if(hi - lo < 1){ lo -= .5; hi += .5; }
    const d0 = ps[0].d, span = Math.max(1, difDias(d0, ps[ps.length-1].d));
    const X = function(d){ return pad + difDias(d0, d) / span * (W - pad - 8); };
    const Y = function(v){ return 8 + (hi - v) / (hi - lo) * (H - 8 - 22); };
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("class", "chart");
    svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Peso diário e tendência");
    function t(x, y, s, anchor){ const e = document.createElementNS(ns, "text"); e.setAttribute("x", x); e.setAttribute("y", y); e.setAttribute("font-size", "11"); e.setAttribute("fill", "var(--muted)"); if(anchor) e.setAttribute("text-anchor", anchor); e.textContent = s; svg.appendChild(e); }
    [hi, (hi + lo) / 2, lo].forEach(function(v){ const l = document.createElementNS(ns, "line"); l.setAttribute("x1", pad); l.setAttribute("x2", W - 8); l.setAttribute("y1", Y(v)); l.setAttribute("y2", Y(v)); l.setAttribute("stroke", "var(--line)"); svg.appendChild(l); t(pad - 4, Y(v) + 4, num(v, 1), "end"); });
    t(pad, H - 4, brCurta(ps[0].d)); t(W - 8, H - 4, brCurta(ps[ps.length-1].d), "end");
    ps.forEach(function(p){ const c = document.createElementNS(ns, "circle"); c.setAttribute("cx", X(p.d)); c.setAttribute("cy", Y(p.kg)); c.setAttribute("r", "3"); c.setAttribute("fill", "var(--muted)"); svg.appendChild(c); });
    const path = document.createElementNS(ns, "path");
    path.setAttribute("d", ps.map(function(p, i){ return (i ? "L" : "M") + X(p.d).toFixed(1) + " " + Y(tr[p.d]).toFixed(1); }).join(" "));
    path.setAttribute("fill", "none"); path.setAttribute("stroke", "var(--accent)"); path.setAttribute("stroke-width", "2.5"); svg.appendChild(path);
    return svg;
  }

  function montarBackup(){

  function celula(v){ return String(v == null ? "" : v).replace(/\|/g, "\\|").replace(/[\r\n]+/g, " ").trim(); }

  }
  function montarBackupMd(dFoco){

    const nome = "mesa-de-ferro-" + iso(agora) + "-" + dois(agora.getHours()) + "h" + dois(agora.getMinutes()) + ".md";
    const ds = Object.keys(dias).sort();
    const tr = tendencia();
    const L = [];
    L.push("# Mesa de Ferro · backup de " + quando, "");
    L.push("> Backup completo. Este arquivo sozinho restaura tudo: na Mesa de Ferro, abra Ajustes > Backup > Importar, escolha este arquivo e marque \"Importar também perfil e plano\". Não edite o bloco \"Dados para restauração\": a assinatura no fim denuncia qualquer alteração.", "");
    L.push("- **Plano:** " + (PLANO.versao || "") + " (" + CARREGADO.origem + ")");

    L.push("- **Assinatura:** fnv1a " + ass + " · " + json.length + " caracteres", "");
    if(dFoco && dias[dFoco]){
      const pl = planoDoDia(dFoco);
      L.push("## Dia " + br(dFoco) + " · " + (PLANO.tipos[pl.tipo] || {}).nome, "");
      const linhas = [];
      pl.refs.forEach(function(r){ r.itens.forEach(function(it){ const m = macros(it.a, it.q); linhas.push([r.hora + " " + r.nome, (ALI[it.a] || {}).n || it.a, num(it.q) + " " + unid(it.a), num(m.kcal), num(m.p, 1), num(m.c, 1), num(m.g, 1), r.ok ? "sim" : "não"]); }); });
      L.push(tabela(["Refeição","Alimento","Quant.","kcal","P","C","G","Registrado"], linhas));
    }
    L.push("## Últimos 28 dias", "");
    L.push(tabela(["Data","Tipo","Peso","Tendência","Meta","Registrado","P","C","G","Completo"], ds.slice(-28).reverse().map(function(d){
      const pl = planoDoDia(d), tt = totaisDia(pl);
      return [br(d), (PLANO.tipos[pl.tipo] || {}).nome, dias[d].pe != null ? num(dias[d].pe, 1) : "", tr[d] != null ? num(tr[d], 1) : "", pl.meta != null ? num(pl.meta) : "", num(tt.reg.kcal), num(tt.reg.p), num(tt.reg.c), num(tt.reg.g), diaCompleto(d) ? "sim" : "não"];
    })));

  function extrairBackup(texto){
    const t = String(texto || "").replace(/^\uFEFF/, "").trim();
    if(!t) return { erro:"Nada para importar." };
    if(t[0] === "{"){ try{ return { bk: JSON.parse(t) }; }catch(e){ return { erro:"Não é um backup válido: " + e.message }; } }
    const i = t.indexOf("<!-- mdf-backup inicio");
    if(i < 0) return { erro:"Não encontrei o bloco \"Dados para restauração\" neste arquivo." };
    const fimCab = t.indexOf("-->", i), cab = t.slice(i, fimCab);
    const mh = /fnv1a=([0-9a-f]{8})/.exec(cab), mn = /dias=(\d+)/.exec(cab), mc = /caracteres=(\d+)/.exec(cab);
    const a = t.indexOf("```json", fimCab); if(a < 0) return { erro:"O bloco de dados está incompleto." };
    const ini = t.indexOf("\n", a), fim = t.indexOf("```", ini);
    if(ini < 0 || fim < 0) return { erro:"O bloco de dados está incompleto." };
    const json = t.slice(ini + 1, fim).replace(/\r/g, "").trim();
    if(mc && json.length !== Number(mc[1])) return { erro:"O bloco de dados está truncado ou foi alterado (o tamanho não confere). Use o backup anterior." };
    if(mh && fnv1a(json) !== mh[1]) return { erro:"O bloco de dados foi alterado (a assinatura não confere). Use o backup anterior." };
    let bk; try{ bk = JSON.parse(json); }catch(e){ return { erro:"O bloco de dados não abre: " + e.message }; }
    if(mn && (!bk || !bk.dias || Object.keys(bk.dias).length !== Number(mn[1]))) return { erro:"O número de dias não confere com a assinatura. Use o backup anterior." };
    return { bk:bk };
  }

  /* Download, com gancho para casca nativa, e pasta automática no Chrome do computador. */
  function baixar(nome, conteudo, tipo){
    if(typeof window.cdfSalvarArquivo === "function"){ try{ window.cdfSalvarArquivo(nome, conteudo, tipo); return true; }catch(e){ return false; } }
    try{
      const blob = new Blob([conteudo], { type: tipo || "application/octet-stream" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome;
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
      return true;
    }catch(e){ return false; }
  }
  function copiar(texto, b){
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(texto).then(function(){ if(b) b.textContent = "Copiado"; }, function(){ if(b) b.textContent = "Não copiou"; }); return; } }catch(e){}
    if(b) b.textContent = "Não copiou";
  }
  const PASTA_OK = typeof window.showDirectoryPicker === "function" && !!window.isSecureContext && window.self === window.top && typeof indexedDB !== "undefined";
  function kv(modo, fn){
    return new Promise(function(ok, falha){
      const r = indexedDB.open("mesa-de-ferro", 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("kv"); };
      r.onerror = function(){ falha(r.error); };
      r.onsuccess = function(){ const tx = r.result.transaction("kv", modo); const q = fn(tx.objectStore("kv")); tx.oncomplete = function(){ ok(q && q.result); }; tx.onerror = function(){ falha(tx.error); }; };
    });
  }
  async function pastaBackup(){ if(!PASTA_OK) return null; try{ return (await kv("readonly", function(s){ return s.get("pasta"); })) || null; }catch(e){ return null; } }
  async function gravarNaPasta(p, nome, texto, pedir){
    let st = await p.queryPermission({ mode:"readwrite" });
    if(st !== "granted" && pedir) st = await p.requestPermission({ mode:"readwrite" });
    if(st !== "granted") return false;
    const fh = await p.getFileHandle(nome, { create:true }); const w = await fh.createWritable(); await w.write(texto); await w.close(); return true;
  }
  function registrarUltimo(nome, destino){ const d = new Date(); lsSet("mdf:ultimoBackup", { nome:nome, destino:destino, quando: iso(d) + " " + dois(d.getHours()) + "h" + dois(d.getMinutes()) }); }
  async function exportarMd(dFoco, st, caixa){
    const md = montarBackupMd(dFoco);
    const p = await pastaBackup();
    if(p){
      try{
        if(await gravarNaPasta(p, md.nome, md.texto, false)){ registrarUltimo(md.nome, "pasta " + p.name); st.textContent = "Backup salvo na pasta " + p.name + ": " + md.nome + "."; return "pasta"; }
        st.textContent = "O Chrome quer nova autorização para a pasta " + p.name + ".";
        const b = botao("Salvar na pasta " + p.name, "", async function(){ if(await gravarNaPasta(p, md.nome, md.texto, true)){ registrarUltimo(md.nome, "pasta " + p.name); st.textContent = "Backup salvo na pasta " + p.name + ": " + md.nome + "."; b.remove(); } });
        caixa.appendChild(b);
      }catch(e){ st.textContent = "A pasta não respondeu (" + e.message + ")."; }
    }
    const ok = baixar(md.nome, md.texto, "text/markdown;charset=utf-8");
    if(ok) registrarUltimo(md.nome, "download");
    st.textContent = (p ? st.textContent + " " : "") + (ok ? "Backup baixado: " + md.nome + ", na pasta Downloads." : "O download falhou. Use Ajustes > Backup.");
    caixa.appendChild(botao("Baixar o backup de novo", "ghost", function(){ baixar(md.nome, md.texto, "text/markdown;charset=utf-8"); }));
    return ok ? "download" : "erro";
  }

      pastaBackup().then(function(p){
        np.textContent = p ? "Cada dia fechado grava o .md na pasta " + p.name + "." : "Escolha uma pasta dentro do OneDrive e cada dia fechado grava o .md nela.";
        bp.appendChild(botao(p ? "Trocar a pasta" : "Escolher a pasta", "", async function(){
          try{ const d = await window.showDirectoryPicker({ id:"mdf-backup", mode:"readwrite", startIn:"documents" }); await kv("readwrite", function(s){ return s.put(d, "pasta"); }); msg(c, "Pasta " + d.name + " escolhida.", "ok"); }
          catch(e){ if(e && e.name !== "AbortError") msg(c, "Não deu para usar a pasta: " + e.message, "err"); }
        }));
      });
    }
    c.appendChild(el("h3", null, "Importar"));
    const fi = el("input"); fi.type = "file"; fi.accept = ".md,.json,.txt,text/markdown,application/json,text/plain"; c.appendChild(fi);
    const ta = el("textarea", "paste"); ta.placeholder = "Ou cole aqui o backup copiado"; ta.style.marginTop = "8px"; c.appendChild(ta);
    const lab = el("label", "chk"); const cb = el("input"); cb.type = "checkbox"; lab.appendChild(cb); lab.appendChild(document.createTextNode("Importar também perfil e plano")); c.appendChild(lab);
    fi.addEventListener("change", function(){ const f = fi.files && fi.files[0]; if(!f) return; const r = new FileReader(); r.onload = function(){ ta.value = String(r.result || ""); }; r.readAsText(f); });
    const bi = el("div", "btns");
    bi.appendChild(botao("Importar", "", function(){
      const lido = extrairBackup(ta.value); if(lido.erro){ msg(c, lido.erro, "err"); return; }
      const bk = lido.bk; if(!bk || bk.app !== "mesa-de-ferro" || typeof bk.dias !== "object"){ msg(c, "Este backup não é da Mesa de Ferro.", "err"); return; }
      let n = 0, mant = 0;
      Object.keys(bk.dias).forEach(function(d){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
        const loc = dias[d], nov = bk.dias[d];
        if(loc && loc.u && (!nov || !nov.u || String(nov.u) < String(loc.u))){ mant++; return; }
        dias[d] = nov; n++;
      });
      salvarDias();
      /* Em todas as categorias, vale a mesma regra dos dias: o registro do aparelho fica quando foi mudado depois do registro do arquivo. */
      const maisNovoAqui = function(loc, nov, uLoc, uNov){ return !!(loc && uLoc && (!nov || !uNov || String(uNov) < String(uLoc))); };
      let medMant = 0;
      const junta = function(atual, novo){ const m = {}; (atual || []).forEach(function(x){ if(x && x.d) m[x.d] = x; }); (novo || []).forEach(function(x){ if(!x || !x.d) return; const l = m[x.d]; if(maisNovoAqui(l, x, l && l.u, x.u)){ medMant++; return; } m[x.d] = x; }); return Object.keys(m).sort().map(function(k){ return m[k]; }); };
      bioimp = junta(bioimp, bk.bio); lsSet("mdf:bio", bioimp); cintura = junta(cintura, bk.cintura); lsSet("mdf:cintura", cintura);
      if(bk.gasto && (!gasto || String(bk.gasto.atualizadoEm) >= String(gasto.atualizadoEm))){ gasto = bk.gasto; lsSet("mdf:gasto", gasto); }
      let extra = "";
      if(cb.checked){
        if(bk.perfil){
          if(maisNovoAqui(perfil, bk.perfil, lsGet("mdf:perfilSalvoEm"), bk.perfilSalvoEm)) extra += " Perfil mantido: o do aparelho foi salvo depois.";
          else { perfil = bk.perfil; lsSet("mdf:perfil", perfil); lsSet("mdf:perfilSalvoEm", bk.perfilSalvoEm || null); extra += " Perfil importado."; }
        }
        if(bk.plano && !bk.plano.modelo && validarPlano(bk.plano).length === 0){
          if(maisNovoAqui(lsGet("mdf:plano"), bk.plano, lsGet("mdf:planoSalvoEm"), bk.planoSalvoEm)) extra += " Plano mantido: o do aparelho foi salvo depois.";
          else { lsSet("mdf:plano", bk.plano); lsSet("mdf:planoSalvoEm", bk.planoSalvoEm || null); extra += " Plano importado."; }
        }
      }
      if(medMant) extra = " " + medMant + (medMant === 1 ? " medida mantida" : " medidas mantidas") + " (cintura ou bioimpedância), porque o aparelho tinha versão mais nova." + extra;
      if(mant) extra = " " + mant + (mant === 1 ? " dia mantido" : " dias mantidos") + ", porque o aparelho tinha versão mais nova." + extra;
      msg(c, n + " dias importados." + extra + " Recarregando…", "ok"); setTimeout(function(){ location.reload(); }, 900);
    }));
    c.appendChild(bi); c.appendChild(fecharBtn());
  }
  function telaCSV(){
    const c = folha("Planilha (CSV)");
    const q = function(v){ v = v == null ? "" : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const L = ["Data;Tipo;Peso;Tendencia;Meta;Registrado;Proteina;Carboidrato;Gordura;Completo"]; const tr = tendencia();
    Object.keys(dias).sort().forEach(function(d){ const pl = planoDoDia(d), tt = totaisDia(pl);
      L.push([br(d), (PLANO.tipos[pl.tipo] || {}).nome, dias[d].pe != null ? String(dias[d].pe).replace(".", ",") : "", tr[d] != null ? tr[d].toFixed(1).replace(".", ",") : "", pl.meta, Math.round(tt.reg.kcal), Math.round(tt.reg.p), Math.round(tt.reg.c), Math.round(tt.reg.g), diaCompleto(d) ? "sim" : "não"].map(q).join(";")); });
    const csv = L.join("\n");
    c.appendChild(el("p", "note", (L.length - 1) + " dias."));
    const b = el("div", "btns");
    b.appendChild(botao("Baixar CSV", "", function(){ baixar("mesa-de-ferro-" + HOJE + ".csv", "\ufeff" + csv, "text/csv;charset=utf-8"); }));
    b.appendChild(botao("Copiar", "ghost", function(){ copiar(csv, this); }));
    c.appendChild(b); c.appendChild(fecharBtn());
  }
  function telaExtra(){
    const c = folha("Refeição extra");
    const nm = el("input", "txt"); nm.placeholder = "Nome (ex.: café com leite, festa)"; c.appendChild(nm);
    const hr = el("input", "txt"); hr.placeholder = "Hora (ex.: 15h)"; hr.style.marginTop = "8px"; c.appendChild(hr);
    c.appendChild(botao("Criar e adicionar alimentos", "", function(){
      const reg = garantirDia(diaAtual); reg.x = reg.x || [];
      const ref = { id:"x" + Date.now().toString(36), nome: nm.value.trim() || "Extra", hora: hr.value.trim(), i:[], ok:false };
      reg.x.push(ref); salvarDias(); abertas[diaAtual + ":" + ref.id] = true; render();
      const r = planoDoDia(diaAtual).refs.find(function(x){ return x.id === ref.id; }); telaAdicionar(r);
    }));
    c.appendChild(fecharBtn());
  }

  /* ================= TEMA E INÍCIO ================= */
  const temaSalvo = lsGet("mdf:tema");
  if(temaSalvo === "dark" || temaSalvo === "light") document.documentElement.setAttribute("data-theme", temaSalvo);
  function alternarTema(){
    const cur = document.documentElement.getAttribute("data-theme");
    const escuro = cur ? cur === "dark" : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    const novo = escuro ? "light" : "dark"; document.documentElement.setAttribute("data-theme", novo); lsSet("mdf:tema", novo);
  }
  $("dia-ant").addEventListener("click", function(){ diaAtual = somaDias(diaAtual, -1); render(); });
  $("dia-prox").addEventListener("click", function(){ if(diaAtual < HOJE){ diaAtual = somaDias(diaAtual, 1); render(); } });
  $("btn-gasto").addEventListener("click", telaGasto);
  $("btn-calc").addEventListener("click", telaCalc);
  $("btn-ajustes").addEventListener("click", telaAjustes);
  $("btn-fechar").addEventListener("click", telaFechar);
  $("btn-add-ref").addEventListener("click", telaExtra);

  if(PLANO.modelo){
    const card = el("section", "card");
    card.appendChild(el("h2", null, "Plano modelo"));
    card.appendChild(el("p", "info", "Este arquivo traz um cardápio de exemplo. Para carregar o seu, abra Ajustes > Backup > Importar, escolha o backup e marque \"Importar também perfil e plano\"."));
    $("aviso").appendChild(card);
  }
  (function(){
    const fs = PLANO.fases || [], fa = faseDe(HOJE), idx = fa ? fs.indexOf(fa) : -1;
    if(idx > 0 && difDias(fa.de, HOJE) < 7){
      const car = isFinite((PLANO.gasto || {}).carenciaDias) ? Number(PLANO.gasto.carenciaDias) : 14;
      const aj = fa.ajuste || {}, kg = densidadeDe(HOJE);
      let txt = aj.tipo === "pct" ? "A meta passa a ser o gasto de trabalho " + (Number(aj.valor) < 0 ? "menos " : "mais ") + num(Math.abs(Number(aj.valor))) + "%." : (Number(aj.valor) ? "A meta passa a ser o gasto de trabalho " + (Number(aj.valor) > 0 ? "mais " : "menos ") + num(Math.abs(Number(aj.valor))) + " kcal; com a densidade de " + num(kg) + " kcal por quilo, o ajuste semanal persegue " + (Number(aj.valor) > 0 ? "+" : "") + num(Number(aj.valor) / kg * 7, 2) + " kg por semana." : "A meta volta a ser o próprio gasto de trabalho, em manutenção.");
      txt += " Nos " + car + " primeiros dias da fase, o gasto não se ajusta (carência); a conta volta a partir de " + br(somaDias(fa.de, car)) + ".";
      const card = el("section", "card"); card.appendChild(el("h2", null, "Fase nova desde " + br(fa.de) + ": " + fa.nome)); card.appendChild(el("p", "info", txt)); $("aviso").appendChild(card);
    }
  })();
  const rev = revisarGasto();
  if(rev && rev.mudou){
    const a = $("aviso"); const card = el("section", "card");
    card.appendChild(el("h2", null, "Gasto ajustado: " + num(rev.ultimo.de) + " → " + num(rev.ultimo.para) + " kcal"));
    card.appendChild(el("p", "info", "Nos últimos dias completos você comeu em média " + num(rev.ultimo.ingestao) + " kcal, e o peso andou " + num(rev.ultimo.kgSemana, 2) + " kg por semana. A meta acompanha."));
    a.appendChild(card);
  }
  render();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{
    const nativo = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform());
    if(!nativo && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function(){});
  }catch(e){}
  window.__mdf = { planoDoDia:planoDoDia, totaisDia:totaisDia, estimarGasto:estimarGasto, equivalentes:equivalentes, montarBackupMd:montarBackupMd, extrairBackup:extrairBackup };
})();
</script>
</body>
